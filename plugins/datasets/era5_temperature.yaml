# Instance override of the built-in era5land_temperature_monthly: identical to
# the built-in, but with the display scale matched to the MODIS LST monthly
# dataset (rdbu_r, -5..35 degC) so the two can be compared side-by-side.
- id: era5land_temperature_monthly
  name: 2m temperature (ERA5-Land)
  short_name: 2m temperature
  variable: t2m
  period_type: monthly
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "1950-01"
      resolution: P1M
  ingestion:
    plugin: open_climate_service.plugins.datasets.era5_land.ERA5LandMonthlyPlugin
    params:
      variable: t2m
  units: degC
  resolution: 9 km x 9 km
  source: ERA5-Land Reanalysis
  source_url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land-monthly-means
  display:
    colormap: rdbu_r
    range: [-5.0, 35.0]
