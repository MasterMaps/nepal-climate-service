[project]
name = "nepal-climate-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "Open Climate Service instance for Nepal"
dependencies = [
    "open-climate-service[server] @ git+https://github.com/dhis2/open-climate-service.git",
    "ecmwf-datastores-client",
    "boto3",
    # Used by plugins/datasets/esa_landcover.py. Previously satisfied transitively by
    # the pinned 0.1.0 [server] extra; main no longer pulls it, so declare it here —
    # the instance that ships the plugin owns the plugin's dependencies.
    "cdsapi",
]

[dependency-groups]
scripts = ["mapflow"]
dev = ["pytest>=8", "pyyaml"]

[tool.pytest.ini_options]
# `package = false`, so make the plugin modules importable the same way the
# running service does (plugins_dir is added to sys.path at startup).
pythonpath = ["plugins"]
testpaths = ["tests"]

[tool.uv.sources]
open-climate-service = { git = "https://github.com/dhis2/open-climate-service.git", branch = "main" }

[tool.uv]
package = false
override-dependencies = [
    "geojson-pydantic>=2.1.0",
    "zarr>=3.1.6",
    "pyarrow>=19.0",
    "xarray>=2025.12.0",
    "numpy>=2.2",
    "dask>=2024.1.0",
    "dask-geopandas>=0.4",
    "geopandas>=1.1",
    "xvec>=0.3",
    "rioxarray>=0.17",
    "pystac>=1.10",
]
