[project]
name = "nepal-climate-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "Open Climate Service instance for Nepal"
dependencies = [
    "open-climate-service[server]==0.1.0",
    "ecmwf-datastores-client",
    "boto3",
]

[dependency-groups]
scripts = ["mapflow"]

[tool.uv]
package = false
override-dependencies = [
    "geojson-pydantic>=2.1.0",
    "zarr>=3.1.6",
    "pyarrow>=19.0",
    "xarray>=2025.12.0",
    "numpy>=2.2",
    "dask>=2024.1.0",
    "dask-geopandas>=0.4",
    "geopandas>=1.1",
    "xvec>=0.3",
    "rioxarray>=0.17",
    "pystac>=1.10",
]
